name: VideoGen application CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Python API, mock worker and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install --upgrade "setuptools==84.2.1"
          python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint Python
        run: ruff check services integrations tests scripts/smoke_mock.py
      - name: Python unit and integration tests
        run: pytest
      - name: CPU end-to-end mock smoke
        run: python -m scripts.smoke_mock
      - name: Python package vulnerability audit
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit --local

  web:
    name: TypeScript, frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
      - name: Install pinned direct dependencies
        run: npm install --prefix apps/web --no-fund
      - name: Typecheck
        run: npm run typecheck --prefix apps/web
      - name: Lint
        run: npm run lint --prefix apps/web
      - name: Frontend HTTP contract tests
        run: npm run test --prefix apps/web
      - name: Production build
        run: npm run build --prefix apps/web
      - name: Production dependency audit
        run: npm audit --prefix apps/web --omit=dev --audit-level=high
