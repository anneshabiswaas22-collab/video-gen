name: VideoGen application CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    name: Python API, mock worker and security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install pinned runtime and test dependencies
        run: |
          python -m pip install --upgrade "pip==26.2" "setuptools==84.2.1"
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Dependency consistency
        run: python -m pip check
      - name: Lint Python
        run: ruff check services integrations tests features/english-speaking-friend/backend features/english-speaking-friend/tests scripts/development/smoke_mock.py tests/browser/smoke.py
      - name: Python unit and integration tests
        run: pytest
      - name: CPU end-to-end mock smoke
        run: python -m scripts.development.smoke_mock
      - name: JavaScript client against live FastAPI mock
        run: |
          python -m uvicorn services.api.main:app --host 127.0.0.1 --port 8001 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8001/v1/health >/dev/null && break
            sleep 0.2
          done
          node apps/web/test/live-api.mjs
      - name: Python package vulnerability audit
        run: |
          python -m pip install pip-audit==2.9.0
          pip-audit --local

  web:
    name: TypeScript, frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install pinned direct dependencies
        run: npm ci --ignore-scripts --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend HTTP contract tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
