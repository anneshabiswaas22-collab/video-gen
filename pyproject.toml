[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen-local-studio"
version = "0.3.0"
description = "VideoGen local studio foundation and English phrase-practice companion"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.163.0",
    "uvicorn==0.38.0",
    "pydantic==2.14.3",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.14.3", "pip-audit==2.9.0"]
browser = ["playwright==1.62.0"]

[tool.setuptools]
packages = ["services", "services.api", "services.worker", "integrations", "integrations.comfyui", "english_friend"]
package-dir = { english_friend = "features/english-speaking-friend/backend/english_friend" }

[tool.setuptools.package-data]
english_friend = ["lessons.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "features/english-speaking-friend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
