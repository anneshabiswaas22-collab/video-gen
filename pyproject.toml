[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "videogen-mock"
version = "0.2.0"
description = "VideoGen CPU-only local mock service (no inference)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.121.1",
    "uvicorn==0.38.0",
    "pydantic==2.12.4",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3"]

[tool.setuptools.packages.find]
include = ["services*", "integrations*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
